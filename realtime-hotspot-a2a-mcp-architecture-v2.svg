      <path d="M0 0 L10 5 L0 10 z" fill="#7c3aed"/>
    </marker>
    <style>
      text { font-family:"Microsoft YaHei","Noto Sans CJK SC","PingFang SC",Arial,sans-serif; fill:#172033; }
      .title { font-size:34px; font-weight:700; }
      .subtitle { font-size:16px; fill:#64748b; }
      .section { font-size:17px; font-weight:700; fill:#334155; }
      .node { font-size:18px; font-weight:700; text-anchor:middle; }
      .small { font-size:14px; fill:#475569; text-anchor:middle; }
      .tiny { font-size:13px; fill:#64748b; text-anchor:middle; }
      .micro { font-size:12px; fill:#64748b; text-anchor:middle; }
      .start { text-anchor:start; }
      .agent { fill:#ffffff; stroke:#4f9cff; stroke-width:2.2; rx:10; filter:url(#shadow); }
      .pipeline { fill:#eff6ff; stroke:#93c5fd; stroke-width:1.8; rx:12; }
      .mcp { fill:#fbf7ff; stroke:#8b5cf6; stroke-width:2.2; }
      .tool { fill:#ffffff; stroke:#475569; stroke-width:2; rx:16; }
      .store { fill:#ecfdf8; stroke:#0f8178; stroke-width:2; }
      .external { fill:#f8fafc; stroke:#94a3b8; stroke-width:1.8; rx:14; }
      .plannedBox { fill:#fffdf3; stroke:#d4a72c; stroke-width:2; stroke-dasharray:8 6; rx:18; }
      .plannedNode { fill:#fffaf0; stroke:#d4a72c; stroke-width:2; stroke-dasharray:7 5; rx:12; }
      .flow { fill:none; stroke:#334155; stroke-width:2.1; marker-end:url(#arrow); }
      .mainflow { fill:none; stroke:#2563eb; stroke-width:2.8; marker-end:url(#arrowBlue); }
      .a2a { fill:none; stroke:#ea580c; stroke-width:2.4; marker-end:url(#arrowA2A); }
      .a2aDash { fill:none; stroke:#ea580c; stroke-width:2.1; stroke-dasharray:7 6; marker-end:url(#arrowA2A); }
      .mcpFlow { fill:none; stroke:#7c3aed; stroke-width:2.4; marker-end:url(#arrowMCP); }
      .mcpDash { fill:none; stroke:#7c3aed; stroke-width:2.2; stroke-dasharray:7 6; marker-end:url(#arrowMCP); }
      .dash { fill:none; stroke:#64748b; stroke-width:1.9; stroke-dasharray:6 6; marker-end:url(#arrow); }
      .planFlow { fill:none; stroke:#b8860b; stroke-width:2.1; stroke-dasharray:7 6; marker-end:url(#arrow); }
