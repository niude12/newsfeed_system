  <polygon points="345,244 485,296 345,348 205,296" fill="#ffffff" stroke="#4f9cff" stroke-width="2.4" filter="url(#shadow)"/>
  <text x="345" y="290" class="node">意图识别 Agent</text>
  <text x="345" y="314" class="small">Qwen-plus · 参数改写 · 歧义追问</text>
  <path d="M218 282 C118 270 98 178 140 184" class="dash"/>
  <text x="119" y="251" class="tiny">信息不足则追问</text>

  <path d="M485 296 H630" class="mainflow"/>
  <rect x="630" y="248" width="380" height="96" class="agent"/>
  <text x="820" y="281" class="node">协调调度 Agent</text>
  <text x="820" y="307" class="small">意图路由 · 任务汇总 · 简报确认</text>
  <text x="820" y="330" class="micro">A2AServer :8000 · AgentCard / Message</text>

  <rect x="1530" y="158" width="300" height="155" class="external"/>
  <text x="1680" y="190" class="node">模型服务</text>
  <text x="1680" y="218" class="small">Qwen-plus：意图 / 核验 / 简报</text>
  <text x="1680" y="244" class="small">text-embedding-v3：事件聚类</text>
  <text x="1680" y="276" class="micro">失败时：规则 / TF 向量 / Markdown 降级</text>
  <path d="M485 268 C810 105 1345 120 1530 190" class="dash"/>

  <!-- Pipeline layer -->
  <text x="72" y="388" class="section" text-anchor="start">② 共享任务流水线层（协调器调用 + 前端直选复用）</text>
