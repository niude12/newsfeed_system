  <rect x="140" y="160" width="410" height="58" rx="29" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="345" y="195" class="node">对话入口：用户自然语言</text>

  <rect x="1050" y="160" width="430" height="58" rx="29" fill="#ffffff" stroke="#1e293b" stroke-width="2.2" filter="url(#shadow)"/>
  <text x="1265" y="185" class="node">前端入口：功能直选</text>
  <text x="1265" y="207" class="micro">热点查询 ｜ 最新新闻 ｜ 账户关注</text>

