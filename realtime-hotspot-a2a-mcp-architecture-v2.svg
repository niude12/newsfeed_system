  <rect x="1852" y="1392" width="48" height="48" fill="#4cc2ef"/>

  <text x="72" y="64" class="title">实时热点资讯多智能体系统 · A2A + MCP 架构（V2 · 基于当前代码）</text>
  <text x="73" y="93" class="subtitle">实线＝当前 Demo 已实现调用链 ｜ 虚线＝模拟降级或后续规划 ｜ 离线 RAG 以规划区展示，不与当前能力混淆</text>

