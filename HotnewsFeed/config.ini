[llm]
base_url = 'https://dashscope.aliyuncs.com/compatible-mode/v1'
api_key = 'sk-2b5f239c7de94502b3f185674e718579'
model_name = 'qwen-plus'


[mysql]
host = 'localhost'
port = '3306'
user = 'root'
password = '123456'
database = 'news_rag'
charset = 'utf8mb4'


# 离线新闻查询缓存（配置参考 edu_rag，使用独立 key 前缀）
[redis]
host = 'localhost'
port = '6379'
password = '1234'
db = '0'
key_prefix = 'hotnews:offline'
cache_ttl_seconds = '21600'


# 离线新闻向量索引（使用本项目独立数据库和集合）
[milvus]
uri = 'http://localhost:19530'
database_name = 'news_rag'
collection_name = 'hotnews_offline'
dimension = '1024'


[offline_news]
# 每天抓取的板块；英文逗号分隔
modules = '科技,财经,体育,娱乐,国际'
per_module_limit = '50'
retention_days = '3'
query_top_k = '3'
schedule_hour = '6'
schedule_minute = '0'
fetch_article_content = 'true'
article_concurrency = '5'
# 入库成功后按板块生成每日简报
daily_briefing_enabled = 'true'
daily_briefing_top_n = '10'
# 可选：feishu,email,webhook,web_ui（多个用英文逗号）
daily_briefing_channels = 'web_ui'


[log]
log_file = os.path.join(project_root, 'HotnewsFeed', 'logs/app.log')


[pass]
url_123 = ""
intent = pass

[temperature]
temperature = 0.1


[embedding]
# 聚类向量化用的 embedding 模型（dashscope 兼容接口，复用 [llm] 的 base_url / api_key）
model_name = 'text-embedding-v3'


[publish]
# 简报推送通道配置；留空 = 未配置 → 该通道优雅降级（标记失败，web_ui 仍写本地 output/briefings/）
# 飞书自定义机器人 webhook 地址
feishu_webhook = ''
# 通用 webhook 地址
webhook_url = ''
# SMTP 服务器（如 smtp.qq.com）
smtp_host = ''
# SMTP 端口（SSL=465 / STARTTLS=587）
smtp_port = '465'
# SMTP 用户名（发送邮箱）
smtp_user = ''
# SMTP 授权码
smtp_password = ''
# 收件人邮箱（多个用逗号分隔）
mail_to = ''
# web_ui 通道本地落盘目录
output_dir = 'output/briefings'


[rss_sources]
# 模块 → RSS 源 URL（英文逗号分隔），覆盖 tools/collect.py 内置默认源
# 科技 = 'https://www.ithome.com/rss/,https://www.36kr.com/feed'


[accounts]
# 账户名 → 抓取地址（账户发布监控），未配置的账户降级为【模拟】样例数据
# 新京报 = 'https://example.com/feed.xml'
bilibili_312249633 = 'https://space.bilibili.com/312249633/video'


[account_monitor]
# 轮询间隔（分钟）
interval_minutes = '30'
latest_limit = '10'
# 首次运行也做视频内容提取（ASR/摘要）并推送新发布
notify_on_first_run = 'true'
process_video_content = 'true'
notify_channels = 'web_ui'
# B 站风控时需配置登录 Cookie；推荐把 Netscape cookies.txt 路径填到 cookie_file
bilibili_cookie = ''
cookie_file = 'storage/bilibili_cookies.txt'
asr_model = 'paraformer-realtime-v2'
temp_dir = 'storage/video_temp'
